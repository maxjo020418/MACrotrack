services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 5

  sniff-collector:
    build:
      context: sniff-collector
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COLLECTOR_HOST: 0.0.0.0
      COLLECTOR_PORT: ${COLLECTOR_PORT}
      COLLECTOR_LOG_LEVEL: ${COLLECTOR_LOG_LEVEL}
      COLLECTOR_API_TOKENS: ${COLLECTOR_API_TOKENS}
      COLLECTOR_AUTH_REQUIRED: ${COLLECTOR_AUTH_REQUIRED}
      COLLECTOR_MAX_BODY_BYTES: ${COLLECTOR_MAX_BODY_BYTES}
      COLLECTOR_HEX_PREVIEW_BYTES: ${COLLECTOR_HEX_PREVIEW_BYTES}
      COLLECTOR_LOG_HEADERS: ${COLLECTOR_LOG_HEADERS}
      COLLECTOR_LOG_RAW_BODY: ${COLLECTOR_LOG_RAW_BODY}
      COLLECTOR_DATABASE_HOST: postgres
      COLLECTOR_DATABASE_PORT: 5432
      COLLECTOR_DATABASE_NAME: ${POSTGRES_DB}
      COLLECTOR_DATABASE_USER: ${POSTGRES_USER}
      COLLECTOR_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      COLLECTOR_AUTO_CREATE_SCHEMA: ${COLLECTOR_AUTO_CREATE_SCHEMA}
      COLLECTOR_STORE_RAW_BODY: ${COLLECTOR_STORE_RAW_BODY}
      COLLECTOR_STORE_RAW_FRAMES: ${COLLECTOR_STORE_RAW_FRAMES}
      COLLECTOR_STORE_RAW_MACS: ${COLLECTOR_STORE_RAW_MACS}
      COLLECTOR_STORE_PLAINTEXT_SSIDS: ${COLLECTOR_STORE_PLAINTEXT_SSIDS}
      COLLECTOR_MAC_HASH_KEY: ${COLLECTOR_MAC_HASH_KEY}
      COLLECTOR_SSID_HASH_KEY: ${COLLECTOR_SSID_HASH_KEY}
    expose:
      - "${COLLECTOR_PORT}"
    ports:
      - "${COLLECTOR_PUBLIC_PORT}:${COLLECTOR_PORT}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.getenv(\\\"COLLECTOR_PORT\\\", \\\"8888\\\")}/health', timeout=3).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana-oss:12.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      sniff-collector:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    expose:
      - "3000"
    ports:
      - "${GRAFANA_PUBLIC_PORT}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  grafana_data:
