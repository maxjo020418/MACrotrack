services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-macrotrack}
      SERVICE_USER_POSTGRES: ${SERVICE_USER_POSTGRES}
      SERVICE_PASSWORD_POSTGRES: ${SERVICE_PASSWORD_POSTGRES}
      SERVICE_USER_GRAFANA_DB: ${SERVICE_USER_GRAFANA_DB}
      SERVICE_PASSWORD_GRAFANA_DB: ${SERVICE_PASSWORD_GRAFANA_DB}
    entrypoint: ["/bin/sh", "/macrotrack-postgres-entrypoint.sh"]
    command: ["postgres"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/entrypoint.sh:/macrotrack-postgres-entrypoint.sh:ro
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${SERVICE_USER_POSTGRES}\" -d \"$${POSTGRES_DB}\""]
      start_period: 60s
      interval: 10s
      timeout: 5s
      retries: 5

  sniff-collector:
    build:
      context: sniff-collector
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COLLECTOR_HOST: 0.0.0.0
      COLLECTOR_PORT: ${COLLECTOR_PORT:-8888}
      COLLECTOR_LOG_LEVEL: ${COLLECTOR_LOG_LEVEL:-info}
      SERVICE_PASSWORD_COLLECTOR_API_TOKEN: ${SERVICE_PASSWORD_COLLECTOR_API_TOKEN}
      COLLECTOR_AUTH_REQUIRED: ${COLLECTOR_AUTH_REQUIRED:-true}
      COLLECTOR_MAX_BODY_BYTES: ${COLLECTOR_MAX_BODY_BYTES:-262144}
      COLLECTOR_HEX_PREVIEW_BYTES: ${COLLECTOR_HEX_PREVIEW_BYTES:-128}
      COLLECTOR_LOG_HEADERS: ${COLLECTOR_LOG_HEADERS:-true}
      COLLECTOR_LOG_RAW_BODY: ${COLLECTOR_LOG_RAW_BODY:-false}
      COLLECTOR_DATABASE_HOST: postgres
      COLLECTOR_DATABASE_PORT: 5432
      COLLECTOR_DATABASE_NAME: ${POSTGRES_DB:-macrotrack}
      SERVICE_USER_POSTGRES: ${SERVICE_USER_POSTGRES}
      SERVICE_PASSWORD_POSTGRES: ${SERVICE_PASSWORD_POSTGRES}
      COLLECTOR_AUTO_CREATE_SCHEMA: ${COLLECTOR_AUTO_CREATE_SCHEMA:-true}
      COLLECTOR_STORE_RAW_BODY: ${COLLECTOR_STORE_RAW_BODY:-false}
      COLLECTOR_STORE_RAW_FRAMES: ${COLLECTOR_STORE_RAW_FRAMES:-true}
      COLLECTOR_STORE_RAW_MACS: ${COLLECTOR_STORE_RAW_MACS:-false}
      COLLECTOR_STORE_PLAINTEXT_SSIDS: ${COLLECTOR_STORE_PLAINTEXT_SSIDS:-false}
      SERVICE_PASSWORD_COLLECTOR_MAC_HASH_KEY: ${SERVICE_PASSWORD_COLLECTOR_MAC_HASH_KEY}
      SERVICE_PASSWORD_COLLECTOR_SSID_HASH_KEY: ${SERVICE_PASSWORD_COLLECTOR_SSID_HASH_KEY}
    expose:
      - "${COLLECTOR_PORT:-8888}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen(f'http://127.0.0.1:{os.getenv(\\\"COLLECTOR_PORT\\\", \\\"8888\\\")}/health', timeout=3).read()\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana-oss:12.1.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      sniff-collector:
        condition: service_started
    entrypoint: ["/bin/sh", "/macrotrack-grafana-entrypoint.sh"]
    environment:
      SERVICE_USER_GRAFANA_ADMIN: ${SERVICE_USER_GRAFANA_ADMIN}
      SERVICE_PASSWORD_GRAFANA_ADMIN: ${SERVICE_PASSWORD_GRAFANA_ADMIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://macrotrack.yeongmin.net/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      POSTGRES_DB: ${POSTGRES_DB:-macrotrack}
      SERVICE_USER_GRAFANA_DB: ${SERVICE_USER_GRAFANA_DB}
      SERVICE_PASSWORD_GRAFANA_DB: ${SERVICE_PASSWORD_GRAFANA_DB}
    expose:
      - "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/entrypoint.sh:/macrotrack-grafana-entrypoint.sh:ro
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  grafana_data:
