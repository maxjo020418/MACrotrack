apiVersion: 1

datasources:
  - name: MACrotrack PostgreSQL
    uid: macrotrack-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${SERVICE_USER_GRAFANA_DB}
    secureJsonData:
      password: ${SERVICE_PASSWORD_GRAFANA_DB}
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: true
